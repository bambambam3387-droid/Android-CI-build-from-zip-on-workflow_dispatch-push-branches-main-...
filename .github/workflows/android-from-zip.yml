name: VerbalMoralityMonitor.zip

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project (fix nested folder)
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o VerbalMoralityMonitor.zip -d .
          echo "Checking for nested VerbalMoralityMonitor folder..."
          if [ -d "VerbalMoralityMonitor" ]; then
            mv VerbalMoralityMonitor/* .
            mv VerbalMoralityMonitor/.* . 2>/dev/null || true
          fi
          echo "Project root contents:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing — using system Gradle"
            gradle assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
